<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AR Marker Test v2.0</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    
    <!-- Componente personalizado para rotación animada -->
    <script>
      // Forzar refresco completo al cargar
      window.onload = function() {
        console.log("Forzando refresco completo de recursos...");
      };
      
      AFRAME.registerComponent('rotate-model', {
        schema: {
          speed: {type: 'number', default: 1}
        },
        tick: function (time, deltaTime) {
          // Convertir deltaTime de ms a segundos y aplicar velocidad
          const rotation = this.el.getAttribute('rotation');
          const rotationSpeed = this.data.speed * (deltaTime / 1000);
          this.el.setAttribute('rotation', {
            x: rotation.x,
            y: rotation.y + rotationSpeed * 15, // Rotar en Y (15 grados por segundo * velocidad)
            z: rotation.z
          });
        }
      });

      // Componente para mejorar la iluminación de los modelos
      AFRAME.registerComponent('better-gltf', {
        schema: {
          emission: {type: 'number', default: 1.0},
          intensity: {type: 'number', default: 2.0}
        },
        init: function() {
          this.el.addEventListener('model-loaded', () => {
            const obj = this.el.getObject3D('mesh');
            if (!obj) return;
            
            // Recorrer todos los materiales del modelo para mejorarlos
            obj.traverse(node => {
              if (node.isMesh && node.material) {
                // Habilitar emisión para que brille un poco por sí mismo
                if (Array.isArray(node.material)) {
                  node.material.forEach(mat => this.enhanceMaterial(mat));
                } else {
                  this.enhanceMaterial(node.material);
                }
              }
            });
          });
        },
        enhanceMaterial: function(material) {
          // Asegurar que el material tenga buenas propiedades para AR
          material.roughness = 0.3;
          material.metalness = 0.8;
          material.emissive = new THREE.Color(0xffffff);
          material.emissiveIntensity = this.data.emission;
          material.needsUpdate = true;
        }
      });
    </script>
    
    <style>
      body, html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      .loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: white;
        font-size: 24px;
      }
      #loading {
        display: flex;
      }
      #no-ar {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        color: white;
        text-align: center;
        padding-top: 20%;
        z-index: 9999;
      }
      #debug-panel {
        position: fixed;
        bottom: 10px;
        right: 10px;
        background: rgba(0,0,0,0.7);
        color: white;
        padding: 10px;
        border-radius: 5px;
        font-family: monospace;
        font-size: 12px;
        z-index: 1000;
      }
      #refresh-btn {
        position: fixed;
        top: 10px;
        right: 10px;
        padding: 8px 16px;
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div id="loading" class="loading">Cargando, por favor espere...</div>
    <div id="no-ar">
      Lo sentimos, la realidad aumentada no está disponible en tu dispositivo.
    </div>
    <div id="debug-panel">Estado: Esperando... v2.0</div>
    <button id="refresh-btn" onclick="window.location.reload(true)">Recargar</button>
    
    <a-scene mindar-image="imageTargetSrc: ./alephinsta.mind;" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false" 
             loading-screen="enabled: false"
             renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      
      <a-assets>
        <a-asset-item id="model" src="./aaa.glb"></a-asset-item>
      </a-assets>
      
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Luces mejoradas -->
        <a-light type="ambient" color="#FFF" intensity="1.5"></a-light>
        <a-light type="directional" 
                color="#FFF" 
                intensity="2.0" 
                position="0 5 5" 
                target="#model-container"
                cast-shadow="true"></a-light>
        <a-light type="point" 
                color="#44F" 
                intensity="1.5" 
                position="-2 3 0"></a-light>
        <a-light type="point" 
                color="#F44" 
                intensity="1.5" 
                position="2 3 0"></a-light>
        <a-light type="point" 
                color="#4F4" 
                intensity="1.5" 
                position="0 3 3"></a-light>
        
        <!-- Contenedor del modelo para facilitar la animación y el posicionamiento -->
        <a-entity id="model-container" position="0 0 0" rotation="0 0 0">
          <!-- Modelo 3D con animación y mejoras -->
          <a-entity 
            id="3d-model"
            position="0 0 0" 
            rotation="0 0 0" 
            scale="0.5 0.5 0.5" 
            gltf-model="#model" 
            animation-mixer="clip: *; loop: repeat; timeScale: 1.5"
            better-gltf="emission: 1.0; intensity: 2.0"
            rotate-model="speed: 1.0"
            shadow="cast: true; receive: true">
            
            <!-- Animaciones A-Frame adicionales -->
            <a-animation attribute="position" 
                        dur="3000" 
                        direction="alternate"
                        easing="ease-in-out-sine" 
                        to="0 0.2 0" 
                        repeat="indefinite"></a-animation>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const debugPanel = document.getElementById('debug-panel');
        
        // Verificar soporte para AR
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('no-ar').style.display = 'block';
          debugPanel.textContent = 'Estado: AR no soportada';
        }
        
        const sceneEl = document.querySelector('a-scene');
        
        // Ocultar pantalla de carga cuando todo esté listo
        sceneEl.addEventListener('loaded', function () {
          document.getElementById('loading').style.display = 'none';
          debugPanel.textContent = 'Estado: Escena cargada v2.0. Busca el marcador.';
        });
        
        // Manejar errores
        sceneEl.addEventListener('arError', function(ev) {
          document.getElementById('loading').innerHTML = "Error: " + ev.detail.error;
          debugPanel.textContent = 'Error: ' + ev.detail.error;
          console.error("AR Error:", ev.detail.error);
        });
        
        // Comprobar si el modelo se carga correctamente
        const model = document.getElementById('3d-model');
        model.addEventListener('model-loaded', function() {
          debugPanel.textContent = 'Estado: Modelo cargado correctamente v2.0';
          console.log('Modelo 3D cargado correctamente');
        });
        
        model.addEventListener('model-error', function(error) {
          debugPanel.textContent = 'Error al cargar modelo: ' + error;
          console.error('Error al cargar el modelo:', error);
        });
        
        // Mostrar mensaje cuando el target es encontrado
        const targetEntity = document.querySelector('[mindar-image-target]');
        targetEntity.addEventListener('targetFound', function() {
          debugPanel.textContent = 'Estado: Target encontrado! v2.0';
          console.log("Target encontrado");
          
          // Reiniciar animación cuando se encuentra el target
          if (model) {
            model.setAttribute('animation-mixer', 'clip: *; loop: repeat; timeScale: 1.5');
          }
        });
        
        targetEntity.addEventListener('targetLost', function() {
          debugPanel.textContent = 'Estado: Target perdido v2.0';
          console.log("Target perdido");
        });
      });
    </script>
  </body>
</html>
