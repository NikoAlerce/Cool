<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Marker Test</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      .loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: white;
        font-size: 24px;
      }
      #loading {
        display: flex;
      }
      #no-ar {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        color: white;
        text-align: center;
        padding-top: 20%;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <div id="loading" class="loading">Cargando, por favor espere...</div>
    <div id="no-ar">
      Lo sentimos, la realidad aumentada no está disponible en tu dispositivo.
    </div>
    
    <a-scene mindar-image="imageTargetSrc: ./alephinsta.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" loading-screen="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      
      <a-assets>
        <a-asset-item id="model" src="./aaa.glb"></a-asset-item>
      </a-assets>
      
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model rotation="0 0 0" position="0 0 0" scale="0.5 0.5 0.5" src="#model" animation-mixer></a-gltf-model>
      </a-entity>
    </a-scene>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // Verificar soporte para AR
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('no-ar').style.display = 'block';
        }
        
        const sceneEl = document.querySelector('a-scene');
        
        // Ocultar pantalla de carga cuando todo esté listo
        sceneEl.addEventListener('loaded', function () {
          document.getElementById('loading').style.display = 'none';
        });
        
        // Manejar errores
        sceneEl.addEventListener('arError', function(ev) {
          document.getElementById('loading').innerHTML = "Error: " + ev.detail.error;
          console.error("AR Error:", ev.detail.error);
        });
        
        // Mostrar mensaje cuando el target es encontrado
        const targetEntity = document.querySelector('[mindar-image-target]');
        targetEntity.addEventListener('targetFound', function() {
          console.log("Target encontrado");
        });
        
        targetEntity.addEventListener('targetLost', function() {
          console.log("Target perdido");
        });
      });
    </script>
  </body>
</html>
