<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AR Marker Test v2.0</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    
    <!-- Componente personalizado para rotación animada -->
    <script>
      // Forzar refresco completo al cargar
      window.onload = function() {
        console.log("Forzando refresco completo de recursos...");
      };
      
      AFRAME.registerComponent('rotate-model', {
        schema: {
          speed: {type: 'number', default: 1}
        },
        tick: function (time, deltaTime) {
          // Convertir deltaTime de ms a segundos y aplicar velocidad
          const rotation = this.el.getAttribute('rotation');
          const rotationSpeed = this.data.speed * (deltaTime / 1000);
          this.el.setAttribute('rotation', {
            x: rotation.x,
            y: rotation.y + rotationSpeed * 15, // Rotar en Y (15 grados por segundo * velocidad)
            z: rotation.z
          });
        }
      });

      // Componente para mejorar la iluminación de los modelos
      AFRAME.registerComponent('better-gltf', {
        schema: {
          emission: {type: 'number', default: 0.0},
          intensity: {type: 'number', default: 0.3}
        },
        init: function() {
          this.el.addEventListener('model-loaded', () => {
            const obj = this.el.getObject3D('mesh');
            if (!obj) return;
            
            // Recorrer todos los materiales del modelo para mejorarlos
            obj.traverse(node => {
              if (node.isMesh && node.material) {
                // Habilitar emisión para que brille un poco por sí mismo
                if (Array.isArray(node.material)) {
                  node.material.forEach(mat => this.enhanceMaterial(mat));
                } else {
                  this.enhanceMaterial(node.material);
                }
              }
            });
          });
        },
        enhanceMaterial: function(material) {
          // Asegurar que el material tenga buenas propiedades para AR
          material.roughness = 0.7;
          material.metalness = 0.3;
          // Eliminar la emisión completamente
          material.emissive = new THREE.Color(0x000000);
          material.emissiveIntensity = 0;
          material.needsUpdate = true;
        }
      });
    </script>
    
    <style>
      body, html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      .loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: white;
        font-size: 24px;
      }
      #loading {
        display: flex;
      }
      #no-ar {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        color: white;
        text-align: center;
        padding-top: 20%;
        z-index: 9999;
      }
      #debug-panel {
        position: fixed;
        bottom: 10px;
        right: 10px;
        background: rgba(0,0,0,0.7);
        color: white;
        padding: 10px;
        border-radius: 5px;
        font-family: monospace;
        font-size: 12px;
        z-index: 1000;
      }
      #refresh-btn {
        position: fixed;
        top: 10px;
        right: 10px;
        padding: 8px 16px;
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div id="loading" class="loading">Cargando, por favor espere...</div>
    <div id="no-ar">
      Lo sentimos, la realidad aumentada no está disponible en tu dispositivo.
    </div>
    <div id="debug-panel">Estado: Esperando... v2.0</div>
    <button id="refresh-btn" onclick="window.location.reload(true)">Recargar</button>
    
    <a-scene mindar-image="imageTargetSrc: ./alephinsta.mind;" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false" 
             loading-screen="enabled: false"
             renderer="colorManagement: false; physicallyCorrectLights: false; antialias: true;">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      
      <a-assets>
        <video id="video-asset" src="./aleph.mp4" preload="auto" loop="true" playsinline crossorigin="anonymous" muted></video>
      </a-assets>
      
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Sin necesidad de tantas luces para video -->
        <a-light type="ambient" color="#FFF" intensity="1.0"></a-light>
        
        <!-- Contenedor del video para facilitar la animación y el posicionamiento -->
        <a-entity id="video-container" position="0 0 0" rotation="0 0 0">
          <!-- Video con animación -->
          <a-video 
            id="ar-video"
            src="#video-asset"
            position="0 0 0" 
            rotation="0 0 0" 
            width="1.5"
            height="1" 
            scale="1 1 1"
            material="shader: flat; transparent: true; side: double; alphaTest: 0.5">
            
            <!-- Animaciones A-Frame adicionales -->
            <a-animation attribute="position" 
                        dur="3000" 
                        direction="alternate"
                        easing="ease-in-out-sine" 
                        to="0 0.2 0" 
                        repeat="indefinite"></a-animation>
                        
            <a-animation attribute="rotation" 
                        dur="15000" 
                        easing="linear" 
                        to="0 360 0" 
                        repeat="indefinite"></a-animation>
          </a-video>
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const debugPanel = document.getElementById('debug-panel');
        const videoEl = document.getElementById('video-asset');
        
        // Verificar soporte para AR
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('no-ar').style.display = 'block';
          debugPanel.textContent = 'Estado: AR no soportada';
        }
        
        const sceneEl = document.querySelector('a-scene');
        
        // Ocultar pantalla de carga cuando todo esté listo
        sceneEl.addEventListener('loaded', function () {
          document.getElementById('loading').style.display = 'none';
          debugPanel.textContent = 'Estado: Escena cargada v3.1. Busca el marcador.';
          
          // Asegurar que el video esté listo para reproducirse
          videoEl.load();
          // Intentamos reproducir el video una vez para evitar problemas de autoplay
          videoEl.muted = true;
          videoEl.play().catch(error => {
            console.log('Autoplay inicial fallido, espere a interactuar: ', error);
          });
        });
        
        // Manejar errores
        sceneEl.addEventListener('arError', function(ev) {
          document.getElementById('loading').innerHTML = "Error: " + ev.detail.error;
          debugPanel.textContent = 'Error: ' + ev.detail.error;
          console.error("AR Error:", ev.detail.error);
        });
        
        // Comprobar si el video se carga correctamente
        videoEl.addEventListener('loadeddata', function() {
          debugPanel.textContent = 'Estado: Video cargado correctamente v3.1';
          console.log('Video cargado correctamente');
        });
        
        videoEl.addEventListener('error', function(error) {
          debugPanel.textContent = 'Error al cargar video: ' + error.message;
          console.error('Error al cargar el video:', error);
        });
        
        // Monitorear estado del video
        videoEl.addEventListener('playing', function() {
          console.log('Video reproduciendo');
          debugPanel.textContent = 'Estado: Video reproduciendo v3.1';
        });
        
        videoEl.addEventListener('pause', function() {
          console.log('Video pausado');
        });
        
        // Mostrar mensaje cuando el target es encontrado
        const targetEntity = document.querySelector('[mindar-image-target]');
        targetEntity.addEventListener('targetFound', function() {
          debugPanel.textContent = 'Estado: Target encontrado! v3.1';
          console.log("Target encontrado");
          
          // Asegurar que el video es visible
          const videoPlane = document.querySelector("#ar-video");
          videoPlane.setAttribute("visible", true);
          
          // Reproducir video cuando se encuentra el target
          if (videoEl.paused) {
            videoEl.play().catch(error => {
              console.error('Error reproduciendo video:', error);
              debugPanel.textContent = 'Error reproduciendo video. Toca la pantalla.';
            });
          }
        });
        
        targetEntity.addEventListener('targetLost', function() {
          debugPanel.textContent = 'Estado: Target perdido v3.1';
          console.log("Target perdido");
          // Pausa el video cuando se pierde el target
          videoEl.pause();
        });
        
        // Manejar interacción del usuario (necesario en muchos navegadores)
        document.body.addEventListener('click', function() {
          debugPanel.textContent = 'Clic detectado. Intentando reproducir video...';
          
          if (videoEl.paused) {
            // Primero intentamos reproducir con mute (más permisivo)
            videoEl.muted = true;
            videoEl.play()
              .then(() => {
                debugPanel.textContent = 'Video reproduciendo (muted)';
                // Después intentamos quitar el mute
                videoEl.muted = false;
              })
              .catch(error => {
                console.error('Error al reproducir video después del clic:', error);
                debugPanel.textContent = 'Error: ' + error.message;
              });
          } else {
            // Si ya está reproduciendo, intentar quitar el mute
            videoEl.muted = false;
            debugPanel.textContent = 'Video ya reproduciendo, quitando mute';
          }
        });
      });
    </script>
  </body>
</html>
