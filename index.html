<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR Visualizador de Modelo 3D</title>
  
  <!-- A-Frame y MindAR.js -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 24px;
    }
  </style>
</head>
<body>
  <div id="loading">Cargando, por favor espere...</div>

  <a-scene mindar-image="imageTargetSrc: https://nikoalerce.github.io/Cool/alephinsta.jpg; maxTrack: 1" color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" loading-screen="enabled: false">
    <a-assets>
      <a-asset-item id="modelo" src="https://nikoalerce.github.io/Cool/aaa.glb" response-type="arraybuffer"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <!-- Modelo 3D -->
      <a-gltf-model rotation="0 0 0" position="0 0 0.1" scale="0.1 0.1 0.1" src="#modelo"></a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const loadingEl = document.querySelector('#loading');
    
    // Ocultar pantalla de carga cuando todo esté listo
    sceneEl.addEventListener('loaded', function () {
      loadingEl.style.display = 'none';
    });

    // Comprobar si el modelo se carga correctamente
    const modelEl = document.querySelector('a-gltf-model');
    modelEl.addEventListener('model-loaded', function() {
      console.log('Modelo cargado exitosamente');
    });
    
    modelEl.addEventListener('model-error', function(e) {
      console.error('Error al cargar el modelo:', e);
      loadingEl.innerHTML = 'Error al cargar el modelo. Por favor, recarga la página.';
    });
  </script>
</body>
</html>
