<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visualizador AR Simple</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    #debug {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
      z-index: 999;
      pointer-events: none;
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 20px;
      text-align: center;
    }
    .btn {
      margin-top: 20px;
      padding: 10px 20px;
      background: white;
      color: black;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div>Inicializando AR...</div>
    <div id="progress">Cargando recursos (0%)</div>
    <button id="startButton" class="btn" style="display:none;">Iniciar AR</button>
  </div>
  
  <div id="debug">Estado: Inicializando...</div>

  <script>
    // Sistema de debug
    const debugEl = document.getElementById('debug');
    const loadingEl = document.getElementById('loading');
    const progressEl = document.getElementById('progress');
    const startButtonEl = document.getElementById('startButton');
    
    function log(message) {
      console.log(message);
      debugEl.textContent = "Estado: " + message;
    }

    // Empezar con un botón para evitar problemas de inicio automático
    startButtonEl.addEventListener('click', function() {
      loadingEl.style.display = 'none';
      startAR();
    });

    // Precargar recursos
    let resourcesLoaded = false;
    function preloadResources() {
      log("Precargando modelo 3D y marcador...");
      
      const total = 2;
      let loaded = 0;
      
      // Precargar imagen del marcador
      const markerImg = new Image();
      markerImg.crossOrigin = "anonymous";
      markerImg.onload = resourceLoaded;
      markerImg.onerror = function() {
        log("Error al cargar el marcador");
        progressEl.textContent = "Error al cargar el marcador";
      };
      markerImg.src = "https://nikoalerce.github.io/Cool/alephinsta.jpg";
      
      // Precargar modelo 3D
      const request = new XMLHttpRequest();
      request.open('GET', 'https://nikoalerce.github.io/Cool/aaa.glb', true);
      request.responseType = 'arraybuffer';
      request.onprogress = function(e) {
        if (e.lengthComputable) {
          const percent = Math.floor((e.loaded / e.total) * 100);
          progressEl.textContent = `Cargando modelo 3D (${percent}%)`;
        }
      };
      request.onload = resourceLoaded;
      request.onerror = function() {
        log("Error al cargar el modelo 3D");
        progressEl.textContent = "Error al cargar el modelo 3D";
      };
      request.send();
      
      function resourceLoaded() {
        loaded++;
        progressEl.textContent = `Recursos cargados (${Math.floor((loaded/total)*100)}%)`;
        
        if (loaded >= total) {
          resourcesLoaded = true;
          progressEl.textContent = "¡Recursos cargados! Listo para iniciar.";
          startButtonEl.style.display = 'block';
        }
      }
    }
    
    function startAR() {
      log("Iniciando sistema AR...");
      
      // Crear escena dinámicamente
      const sceneEl = document.createElement('a-scene');
      sceneEl.setAttribute('mindar-image', {
        imageTargetSrc: 'https://nikoalerce.github.io/Cool/alephinsta.jpg',
        maxTrack: 1,
        filterMinCF: 0.0001,
        filterBeta: 0.001,
        warmupTolerance: 5,
        missTolerance: 5
      });
      sceneEl.setAttribute('color-space', 'sRGB');
      sceneEl.setAttribute('renderer', 'colorManagement: true; physicallyCorrectLights');
      sceneEl.setAttribute('vr-mode-ui', 'enabled: false');
      sceneEl.setAttribute('device-orientation-permission-ui', 'enabled: false');
      
      const assetsEl = document.createElement('a-assets');
      
      const modelAsset = document.createElement('a-asset-item');
      modelAsset.setAttribute('id', 'modelo');
      modelAsset.setAttribute('src', 'https://nikoalerce.github.io/Cool/aaa.glb');
      assetsEl.appendChild(modelAsset);
      
      const cameraEl = document.createElement('a-camera');
      cameraEl.setAttribute('position', '0 0 0');
      cameraEl.setAttribute('look-controls', 'enabled: false');
      
      const targetEl = document.createElement('a-entity');
      targetEl.setAttribute('mindar-image-target', 'targetIndex: 0');
      
      const modelEl = document.createElement('a-gltf-model');
      modelEl.setAttribute('id', 'modeloAR');
      modelEl.setAttribute('rotation', '0 0 0');
      modelEl.setAttribute('position', '0 0 0.1');
      modelEl.setAttribute('scale', '0.08 0.08 0.08');
      modelEl.setAttribute('src', '#modelo');
      
      targetEl.appendChild(modelEl);
      sceneEl.appendChild(assetsEl);
      sceneEl.appendChild(cameraEl);
      sceneEl.appendChild(targetEl);
      document.body.appendChild(sceneEl);
      
      // Eventos
      sceneEl.addEventListener('loaded', function() {
        log("Escena cargada, esperando marcador...");
      });
      
      targetEl.addEventListener('targetFound', function() {
        log("¡Marcador encontrado!");
      });
      
      targetEl.addEventListener('targetLost', function() {
        log("Marcador perdido. Vuelva a mostrar el marcador a la cámara.");
      });
      
      modelEl.addEventListener('model-loaded', function() {
        log("Modelo 3D cargado correctamente.");
      });
      
      modelEl.addEventListener('model-error', function() {
        log("Error al cargar el modelo 3D");
      });
    }
    
    // Iniciar la aplicación
    document.addEventListener('DOMContentLoaded', function() {
      log("Página cargada. Verificando recursos...");
      preloadResources();
    });
  </script>
</body>
</html>
